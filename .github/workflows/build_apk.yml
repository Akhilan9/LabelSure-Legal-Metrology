name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        run: |
          cd frontend_flutter
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd frontend_flutter
          flutter build apk --release

      - name: Rename APK for Distribution
        run: |
          cp frontend_flutter/build/app/outputs/flutter-apk/app-release.apk LabelSure-LegalMetrology-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LabelSure-Android-APK
          path: LabelSure-LegalMetrology-release.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "LabelSure Legal Metrology - Android APK Release"
          draft: false
          prerelease: false
          body: |
            ## 📱 LabelSure Legal Metrology AI (Android APK)

            Automated build from commit `${{ github.sha }}`.

            ### ⬇️ How to Download & Install on Your Phone:
            1. **Direct Download**: Download the [`LabelSure-LegalMetrology-release.apk`](https://github.com/${{ github.repository }}/releases/download/v1.0.0-apk/LabelSure-LegalMetrology-release.apk) file directly to your phone.
            2. **Install**: Open the downloaded APK on your phone and tap **Install** *(if prompted, enable "Install unknown apps" for your browser)*.
            3. **Connect to Backend**: On the login screen, tap **"Server: http://..."** to enter your server address (e.g. your PC's local Wi-Fi IP address like `http://192.168.1.x:8000/api/v1` or cloud URL).
            4. **Sign In**:
               - **Officer**: `officer@labelsure.local` / `InspectorPass123!`
               - **Inspector**: `inspector@labelsure.local` / `Inspector@12345678`
          files: |
            LabelSure-LegalMetrology-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
